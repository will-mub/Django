<!-- Supplier delete confirmation page: confirms that a vendor record should be marked inactive. -->


{% extends 'base.html' %}

{% block title %}Deactivate Supplier{% endblock %}

{% block content %}

<h1>Deactivate Supplier</h1>

<div class="panel">

    <p>
        Are you sure you want to deactivate
        <strong>{{ supplier.name }}</strong>?
    </p>

    <p>The supplier record will be retained in the system.</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="button">
            Confirm Deactivation
        </button>

        <a href="{% url 'supplier_list' %}" class="button">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
