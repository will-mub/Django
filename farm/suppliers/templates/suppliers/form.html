<!-- Suppliers form page: captures company and contact details for new or edited suppliers. -->


{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<h1>{{ page_title }}</h1>

<div class="panel">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">
            <i class="bi bi-check-circle"></i> Save Supplier
        </button>

        <a href="{% url 'supplier_list' %}" class="button">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
