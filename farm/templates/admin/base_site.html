<!-- Admin base template: customizes the Django admin branding for the farm management system. -->


{% extends "admin/base.html" %}
{% load static %}

{% block title %}
    {% if title %}{{ title }} | {% endif %}Farm Manager Administration
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">
        <i class="bi bi-flower1"></i>
        Farm Management System
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/admin-custom.css' %}">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
{% endblock %}
