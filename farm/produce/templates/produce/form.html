<!-- Produce form page: captures product details such as pricing, category, and stock levels. -->


{% extends 'base.html' %}

{% block content %}

<h1>{{ title }}</h1>

<div class="card">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">
            Save Produce
        </button>

        <a href="{% url 'produce_list' %}">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
