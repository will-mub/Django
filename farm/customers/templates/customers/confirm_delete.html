<!-- Customer delete confirmation page: asks for confirmation before removing a customer record. -->


{% extends 'base.html' %}

{% block title %}Delete Customer{% endblock %}

{% block content %}

<h1>Delete Customer</h1>

<div class="panel">
    <p>
        Are you sure you want to delete
        <strong>{{ customer.full_name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="button">
            Confirm Delete
        </button>

        <a href="{% url 'customer_list' %}" class="button">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
